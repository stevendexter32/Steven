<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KOERA Alain Steven — Portfolio & Éditeur</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:        #0b0e13;
      --bg2:       #111520;
      --bg3:       #181d2a;
      --border:    rgba(255,255,255,.07);
      --accent:    #4f8ef7;
      --accent2:   #7ab3ff;
      --gold:      #e2b96a;
      --white:     #f0f4ff;
      --muted:     rgba(240,244,255,.45);
      --card-bg:   rgba(255,255,255,.03);
      --r:         .35s cubic-bezier(.4,0,.2,1);
    }
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    html { scroll-behavior:smooth; font-size:16px; }
    body { font-family:'Inter', sans-serif; background:var(--bg); color:var(--white); overflow-x:hidden; line-height:1.6; }
    
    .page-wrap { max-width:1100px; margin:0 auto; padding:0 2rem; position:relative; z-index:1; }

    /* Top Nav / Admin Link */
    .top-nav { display:flex; justify-content:space-between; align-items:center; padding:1.5rem 0; border-bottom:1px solid var(--border); margin-bottom:2rem; }
    .logo-text { font-family:'Syne', sans-serif; font-weight:700; font-size:1rem; color:var(--white); text-decoration:none; }
    .admin-link { font-size:.75rem; text-transform:uppercase; letter-spacing:.1em; color:var(--accent2); text-decoration:none; padding:.5rem 1rem; border:1px solid rgba(79,142,247,.3); border-radius:6px; background:rgba(79,142,247,.05); transition:all var(--r); }
    .admin-link:hover { background:rgba(79,142,247,.15); }

    /* Hero section minimaliste */
    #hero { padding:3rem 0 2rem; text-align:center; }
    .hero-name { font-family:'Syne', sans-serif; font-size:clamp(2.2rem, 4vw, 3.5rem); font-weight:800; margin-bottom:.5rem; }
    .hero-role { color:var(--gold); font-size:.9rem; letter-spacing:.15em; text-transform:uppercase; margin-bottom:1.5rem; }

    /* Section Éditeur de documents */
    #editor-section { padding:3rem 0 5rem; }
    .section-header { margin-bottom:2rem; text-align:center; }
    .section-eyebrow { font-size:.65rem; letter-spacing:.3em; text-transform:uppercase; color:var(--accent); display:block; margin-bottom:.5rem; }
    .section-title { font-family:'Syne', sans-serif; font-size:2rem; font-weight:800; }
    .section-title span { color:var(--accent); }

    .editor-card {
      background:var(--card-bg);
      border:1px solid var(--border);
      border-radius:16px;
      padding:2rem;
      max-width:700px;
      margin:0 auto;
      backdrop-filter:blur(10px);
    }

    .form-group { margin-bottom:1.2rem; }
    label { display:block; font-size:.75rem; text-transform:uppercase; letter-spacing:.1em; color:var(--muted); margin-bottom:.4rem; }
    
    .input-field, select, textarea {
      width:100%; padding:.8rem 1rem;
      border-radius:8px; border:1px solid var(--border);
      background:var(--bg3); color:var(--white);
      font-family:'Inter', sans-serif; font-size:.9rem;
    }
    textarea { min-height:180px; resize:vertical; line-height:1.5; }

    .editor-toolbar {
      display:flex; gap:.5rem; margin-bottom:.5rem; flex-wrap:wrap;
    }
    .tool-btn {
      background:var(--bg2); border:1px solid var(--border); color:var(--white);
      padding:.3rem .8rem; border-radius:4px; font-size:.8rem; cursor:pointer;
    }
    .tool-btn:hover { background:var(--accent); border-color:var(--accent); }

    .btn {
      display:inline-flex; align-items:center; justify-content:center; gap:.5rem;
      font-family:'Syne', sans-serif; font-size:.8rem; font-weight:600;
      letter-spacing:.12em; text-transform:uppercase; text-decoration:none;
      padding:.9rem 1.8rem; border-radius:8px; transition:all var(--r);
      cursor:pointer; border:none; width:100%;
    }
    .btn-blue { background:var(--accent); color:#fff; box-shadow:0 4px 20px rgba(79,142,247,.3); }
    .btn-blue:hover { background:var(--accent2); transform:translateY(-2px); }

    #statusMsg { font-size:.85rem; text-align:center; margin-top:1rem; min-height:1.5em; }

    footer { border-top:1px solid var(--border); padding:2rem 0; text-align:center; font-size:.75rem; color:var(--muted); margin-top:4rem; }
  </style>
</head>
<body>

<div class="page-wrap">
  
  <header class="top-nav">
    <a href="#" class="logo-text">KOERA Alain Steven</a>
    <a href="admin.html" class="admin-link">🔑 Espace Admin / Fichiers</a>
  </header>

  <section id="hero">
    <h1 class="hero-name">Créateur de Documents</h1>
    <p class="hero-role">Rédigez, nommez et publiez vos fichiers directement sur le site</p>
  </section>

  <section id="editor-section">
    <div class="editor-card">
      
      <div class="form-group">
        <label for="fileType">Type de fichier</label>
        <select id="fileType" class="input-field" onchange="updateEditorHint()">
          <option value="docx">Microsoft Word (.doc / .docx)</option>
          <option value="xlsx">Microsoft Excel (.xls / .xlsx)</option>
          <option value="pptx">Microsoft PowerPoint (.txt / Diapos)</option>
          <option value="txt">Fichier Texte simple (.txt)</option>
        </select>
      </div>

      <div class="form-group">
        <label for="fileName">Nom du fichier (sans extension)</label>
        <input type="text" id="fileName" class="input-field" placeholder="Ex: Mon_Rapport_Maintenance">
      </div>

      <div class="form-group">
        <label>Contenu du document</label>
        <!-- Barre d'outils simple pour Word -->
        <div id="wordToolbar" class="editor-toolbar">
          <button type="button" class="tool-btn" onclick="formatText('<b>', '</b>')"><b>Gras</b></button>
          <button type="button" class="tool-btn" onclick="formatText('<h3>', '</h3>')">Titre</button>
          <button type="button" class="tool-btn" onclick="formatText('<ul><li>', '</li></ul>')">Liste</button>
        </div>
        <textarea id="fileContent" placeholder="Tapez ou collez votre contenu ici..."></textarea>
        <small id="editorHint" style="color:var(--muted); font-size:.75rem; display:block; margin-top:.4rem;">
          Format Word : Vous pouvez structurer votre texte. Il sera directement enregistré et téléchargeable.
        </small>
      </div>

      <button onclick="saveAndPublishFile()" class="btn btn-blue">Créer et Enregistrer sur le site</button>
      <p id="statusMsg"></p>

    </div>
  </section>

  <footer>
    <p>© 2026 KOERA Alain Steven · Tous droits réservés</p>
  </footer>

</div>

<script>
  function updateEditorHint() {
    const type = document.getElementById('fileType').value;
    const toolbar = document.getElementById('wordToolbar');
    const hint = document.getElementById('editorHint');
    const content = document.getElementById('fileContent');

    if (type === 'docx') {
      toolbar.style.display = 'flex';
      hint.textContent = "Mode Word : Utilisez la mise en forme si besoin.";
      content.placeholder = "Rédigez votre document Word...";
    } else if (type === 'xlsx') {
      toolbar.style.display = 'none';
      hint.textContent = "Mode Excel : Collez vos tableaux ou données (colonnes séparées par des tabulations).";
      content.placeholder = "Cellule A1\tCellule B1\nCellule A2\tCellule B2";
    } else if (type === 'pptx') {
      toolbar.style.display = 'none';
      hint.textContent = "Mode PowerPoint : Séparez vos diapositives par '---'.";
      content.placeholder = "Diapositive 1 : Titre\nContenu de la diapo...\n---\nDiapositive 2 : Titre\nContenu...";
    } else {
      toolbar.style.display = 'none';
      hint.textContent = "Mode Texte simple (.txt).";
      content.placeholder = "Votre texte brut...";
    }
  }

  function formatText(openTag, closeTag) {
    const textarea = document.getElementById('fileContent');
    const start = textarea.selectionStart;
    const end = textarea.selectionEnd;
    const val = textarea.value;
    textarea.value = val.substring(0, start) + openTag + val.substring(start, end) + closeTag + val.substring(end);
    textarea.focus();
  }

  async function saveAndPublishFile() {
    const type = document.getElementById('fileType').value;
    const rawName = document.getElementById('fileName').value.trim();
    const content = document.getElementById('fileContent').value;
    const status = document.getElementById('statusMsg');

    if (!rawName) {
      status.textContent = "❌ Veuillez donner un nom au fichier.";
      status.style.color = "#ff9a9a";
      return;
    }
    if (!content.trim()) {
      status.textContent = "❌ Le contenu du fichier ne peut pas être vide.";
      status.style.color = "#ff9a9a";
    }

    status.textContent = "Création et envoi en cours...";
    status.style.color = "#7ab3ff";

    let mimeType = 'text/plain';
    let ext = 'txt';
    let fileBody = content;

    if (type === 'docx') {
      ext = 'doc';
      mimeType = 'application/msword';
      // Format HTML compatible Word natif
      fileBody = `<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'><body>${content.replace(/\n/g, '<br>')}</body></html>`;
    } else if (type === 'xlsx') {
      ext = 'xls';
      mimeType = 'application/vnd.ms-excel';
      // Format HTML Table compatible Excel natif
      const rows = content.split('\n').map(r => `<tr>${r.split('\t').map(c => `<td>${c}</td>`).join('')}</tr>`).join('');
      fileBody = `<table>${rows}</table>`;
    } else if (type === 'pptx') {
      ext = 'txt'; // Ou format texte structuré de présentation
      mimeType = 'text/plain';
    } else {
      ext = 'txt';
      mimeType = 'text/plain';
    }

    const finalFilename = `${rawName}.${ext}`;
    const blobFile = new Blob([fileBody], { type: mimeType });

    try {
      const res = await fetch('/api/upload', {
        method: 'POST',
        headers: {
          'x-filename': finalFilename,
          'x-visibility': 'public',
          'x-uploader': 'Propriétaire',
          'Content-Type': mimeType
        },
        body: blobFile
      });

      if (res.ok) {
        status.textContent = `✅ Fichier "${finalFilename}" créé et enregistré avec succès ! Retrouvez-le dans l'Espace Admin.`;
        status.style.color = "#7ee89a";
        document.getElementById('fileName').value = '';
        document.getElementById('fileContent').value = '';
      } else {
        status.textContent = "❌ Erreur lors de l'enregistrement.";
        status.style.color = "#ff9a9a";
      }
    } catch (err) {
      status.textContent = "❌ Erreur réseau.";
      status.style.color = "#ff9a9a";
    }
  }
</script>

</body>
</html>
