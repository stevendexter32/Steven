<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Fichiers reçus</title>
<style>
  body { font-family: sans-serif; background:#0b0e13; color:#f0f4ff; padding:2rem; max-width:800px; margin:0 auto; }
  h1 { margin-bottom:1.5rem; }
  input[type=password] { padding:.6rem; width:100%; max-width:300px; border-radius:6px; border:1px solid #333; background:#181d2a; color:#fff; }
  button { padding:.6rem 1.2rem; border-radius:6px; border:none; background:#4f8ef7; color:#fff; cursor:pointer; margin-left:.5rem; }
  .file-item { background:#111520; border:1px solid #222; border-radius:10px; padding:1rem; margin-bottom:.8rem; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:.5rem; }
  .file-info { font-size:.85rem; color:#aab; }
  .badge { font-size:.65rem; padding:.2rem .5rem; border-radius:4px; margin-left:.5rem; }
  .badge-public { background:#1e5a2a; color:#7ee89a; }
  .badge-private { background:#5a1e1e; color:#ff9a9a; }
  a.dl { color:#7ab3ff; text-decoration:none; margin-right:.8rem; }
  button.del { background:#c0392b; }
  #login { margin-bottom:2rem; }
</style>
</head>
<body>

<h1>📁 Fichiers reçus</h1>

<div id="login">
  <input type="password" id="pwd" placeholder="Mot de passe admin">
  <button onclick="loadFiles()">Se connecter</button>
</div>

<div id="files"></div>

<script>
  async function loadFiles() {
    const pwd = document.getElementById('pwd').value;
    localStorage.setItem('admin_pwd', pwd);
    const res = await fetch('/api/list', {
      headers: { 'x-admin-password': pwd }
    });
    const data = await res.json();
    const container = document.getElementById('files');
    container.innerHTML = '';

    if (!data.files || data.files.length === 0) {
      container.innerHTML = '<p>Aucun fichier pour le moment.</p>';
      return;
    }

    data.files.forEach(f => {
      const div = document.createElement('div');
      div.className = 'file-item';
      div.innerHTML = `
        <div>
          <strong>${f.name}</strong>
          <span class="badge ${f.visibility === 'public' ? 'badge-public' : 'badge-private'}">${f.visibility}</span>
          <div class="file-info">Par ${f.uploader} · ${new Date(f.date).toLocaleString('fr-FR')}</div>
        </div>
        <div>
          <a class="dl" href="${f.url}" target="_blank">Télécharger</a>
          <button class="del" onclick="deleteFile('${f.path}', '${f.metaPath}')">Supprimer</button>
        </div>
      `;
      container.appendChild(div);
    });
  }

  async function deleteFile(filePath, metaPath) {
    if (!confirm('Supprimer ce fichier définitivement ?')) return;
    const pwd = localStorage.getItem('admin_pwd');
    const res = await fetch('/api/delete', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-admin-password': pwd },
      body: JSON.stringify({ filePath, metaPath })
    });
    if (res.ok) {
      loadFiles();
    } else {
      alert('Erreur lors de la suppression');
    }
  }

  const saved = localStorage.getItem('admin_pwd');
  if (saved) {
    document.getElementById('pwd').value = saved;
    loadFiles();
  }
</script>
</body>
</html>
