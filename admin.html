<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Gestion des Fichiers</title>
<style>
  body { font-family: sans-serif; background:#0b0e13; color:#f0f4ff; padding:2rem; max-width:800px; margin:0 auto; }
  h1 { margin-bottom:.5rem; }
  p.sub { color:#aab; font-size:.85rem; margin-bottom:1.5rem; }
  input[type=password] { padding:.6rem; width:100%; max-width:300px; border-radius:6px; border:1px solid #333; background:#181d2a; color:#fff; }
  button { padding:.6rem 1.2rem; border-radius:6px; border:none; background:#4f8ef7; color:#fff; cursor:pointer; margin-left:.5rem; font-weight:600; }
  button:hover { background:#7ab3ff; }
  .file-item { background:#111520; border:1px solid #222; border-radius:10px; padding:1rem; margin-bottom:.8rem; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:.5rem; }
  .file-info { font-size:.75rem; color:#889; margin-top:.2rem; }
  a.dl { color:#7ab3ff; text-decoration:none; margin-right:.8rem; font-weight:500; }
  a.dl:hover { text-decoration:underline; }
  button.del { background:#c0392b; }
  button.del:hover { background:#e74c3c; }
  #login { margin-bottom:2rem; background:#111520; padding:1.5rem; border-radius:10px; border:1px solid #222; }
  .back-link { display:inline-block; margin-bottom:1.5rem; color:#7ab3ff; text-decoration:none; font-size:.85rem; }
  .back-link:hover { text-decoration:underline; }
</style>
</head>
<body>

<a href="index.html" class="back-link">← Retour au portfolio</a>

<h1>🔑 Espace Admin Sécurisé</h1>
<p class="sub">Entrez votre clé d'accès administrateur pour lister, télécharger ou supprimer les fichiers.</p>

<div id="login">
  <input type="password" id="pwd" placeholder="Clé d'accès admin">
  <button onclick="loadFiles()">Se connecter</button>
  <p id="loginError" style="color:#ff9a9a; font-size:.8rem; margin-top:.5rem;"></p>
</div>

<div id="filesContainer" style="display:none;">
  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem;">
    <h2>📁 Fichiers enregistrés</h2>
    <button onclick="logout()" style="background:#333; font-size:.75rem; padding:.4rem .8rem;">Déconnexion</button>
  </div>
  <div id="files"></div>
</div>

<script>
  async function loadFiles() {
    const pwd = document.getElementById('pwd').value;
    const errorEl = document.getElementById('loginError');
    errorEl.textContent = "Vérification...";

    try {
      // Vérification réelle du mot de passe auprès de l'API list.js (qui compare avec process.env.ADMIN_PASSWORD)
      const res = await fetch('/api/list', {
        headers: { 'x-admin-password': pwd }
      });
      
      if (!res.ok) {
        errorEl.textContent = "❌ Clé d'accès incorrecte.";
        return;
      }

      const data = await res.json();
      // On mémorise le mot de passe uniquement si l'API a validé qu'il est correct
      localStorage.setItem('admin_pwd', pwd);
      
      document.getElementById('login').style.display = 'none';
      document.getElementById('filesContainer').style.display = 'block';

      const container = document.getElementById('files');
      container.innerHTML = '';

      if (!data.files || data.files.length === 0) {
        container.innerHTML = '<p style="color:#889;">Aucun fichier créé pour le moment.</p>';
        return;
      }

      data.files.forEach(f => {
        const div = document.createElement('div');
        div.className = 'file-item';
        div.innerHTML = `
          <div>
            <strong>📄 ${f.name}</strong>
            <div class="file-info">Créé le ${new Date(f.date).toLocaleString('fr-FR')}</div>
          </div>
          <div>
            <a class="dl" href="${f.url}" target="_blank" download>Télécharger</a>
            <button class="del" onclick="deleteFile('${f.path}', '${f.metaPath}')">Supprimer</button>
          </div>
        `;
        container.appendChild(div);
      });
    } catch (err) {
      errorEl.textContent = "❌ Erreur de connexion au serveur.";
    }
  }

  async function deleteFile(filePath, metaPath) {
    if (!confirm('Voulez-vous vraiment supprimer ce fichier définitivement ?')) return;
    const pwd = localStorage.getItem('admin_pwd');
    
    try {
      const res = await fetch('/api/delete', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'x-admin-password': pwd },
        body: JSON.stringify({ filePath, metaPath })
      });
      
      if (res.ok) {
        loadFiles();
      } else {
        alert('Erreur lors de la suppression : clé invalide ou fichier introuvable.');
      }
    } catch (err) {
      alert('Erreur réseau lors de la suppression.');
    }
  }

  function logout() {
    localStorage.removeItem('admin_pwd');
    location.reload();
  }

  // Vérification au chargement si un mot de passe était sauvegardé
  const saved = localStorage.getItem('admin_pwd');
  if (saved) {
    document.getElementById('pwd').value = saved;
    loadFiles();
  }
</script>
</body>
</html>
